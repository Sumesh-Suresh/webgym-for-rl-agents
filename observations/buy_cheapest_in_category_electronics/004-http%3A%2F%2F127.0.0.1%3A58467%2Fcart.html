<!DOCTYPE html><html lang="en"><head>
          <meta charset="utf-8">
          <title>Cart</title>
          <style>
            .home-nav {
              display: flex;
              gap: 1rem;
              margin-top: 1rem;
            }

            .site-nav {
              margin-bottom: 1.5rem;
            }

            .product-filters {
              margin-top: 2rem;
              margin-bottom: 1.5rem;
            }

            table[aria-label="Product list"] {
              border-collapse: collapse;
              margin-top: 1rem;
            }

            table[aria-label="Cart items"] {
              border-collapse: collapse;
              margin: 1rem 0;
            }

            table[aria-label="Order contents"] {
              border-collapse: collapse;
              margin: 1rem 0;
            }

            .order-action {
              display: inline;
              margin: 0 0.5rem;
            }

            table[aria-label="Cart items"] tfoot a {
              margin-right: 1rem;
            }

            .cart-action {
              display: inline-flex;
              gap: 0.5rem;
              align-items: center;
            }

            .cart-action input[name="quantity"] {
              width: 4rem;
            }

            table[aria-label="Product list"] th,
            table[aria-label="Product list"] td,
            table[aria-label="Cart items"] th,
            table[aria-label="Cart items"] td,
            table[aria-label="Order contents"] th,
            table[aria-label="Order contents"] td {
              border: 1px solid #999;
              padding: 0.5rem 1rem;
              text-align: left;
            }
          </style>
        </head>
        <body>
          
          <main>
            <h1>Cart</h1>
            <table aria-label="Cart items">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Product ID</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Total</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr data-testid="cart-item-SKU-E3333">
                  <td>Wireless Mouse</td>
                  <td>SKU-E3333</td>
                  <td>
                    <form class="cart-action" method="post" action="/cart/update">
                      <input type="hidden" name="sku" value="SKU-E3333">
                      <input data-testid="cart-quantity-SKU-E3333" name="quantity" type="number" min="1" value="1">
                      <button data-testid="update-cart-item-SKU-E3333" type="submit">Update</button>
                    </form>
                  </td>
                  <td>$24.99</td>
                  <td>
                    <form class="cart-action" method="post" action="/cart/remove">
                      <input type="hidden" name="sku" value="SKU-E3333">
                      <button data-testid="remove-cart-item-SKU-E3333" type="submit">Remove</button>
                    </form>
                  </td>
                </tr>
                </tbody>
              <tfoot>
                <tr>
                  <td colspan="5">
                    <a href="/">Add More</a>
                    <a data-testid="checkout-link" href="/checkout">Checkout</a>
                  </td>
                </tr>
              </tfoot>
            </table>
            <p>Subtotal $24.99</p>
            
            <p>Total $24.99</p>
            <form method="post" action="/cart/coupon">
              <label>Coupon <input data-testid="coupon-code" name="coupon_code" value=""></label>
              <button data-testid="apply-coupon" type="submit">Apply coupon</button>
            </form>
            </main>
        
        
        </body></html>
